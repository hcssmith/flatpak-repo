name: Flatpak repo

# Builds com.hcssmith.Nvim and com.hcssmith.Neovide and publishes the
# resulting OSTree repo to GitHub Pages, served from
# https://flatpak.hcssmith.com with the site root as the repo root.
#
# One-time repo setup:
#   * Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#     (the configure-pages step below enables this itself via `enablement`)
#   * Settings -> Pages -> Custom domain: flatpak.hcssmith.com
#   * DNS: CNAME flatpak.hcssmith.com -> hcssmith.github.io, then enable
#     "Enforce HTTPS" once the certificate has been issued.
#
# The repo is GPG-signed with a dedicated key: every exported commit,
# the summary and the static deltas are signed in CI, and
# hcssmith.flatpakrepo ships the public key so clients verify both the
# summary and commits (required for system installs). The private key
# (base64 armored export) lives in the repo secret
# FLATPAK_GPG_PRIVATE_KEY; the fingerprint is pinned below.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_DOMAIN: flatpak.hcssmith.com
  FLATPAK_GPG_FINGERPRINT: 26AC310951E6854A786D022C6BED4B2DE001F7F6

concurrency:
  group: flatpak-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The skia build tree inside the neovide module is huge; reclaim what
      # the stock runner image wastes so / does not fill up.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      # Module-level build cache. flatpak-builder revalidates every cached
      # module against the manifest, so restoring an older key only rebuilds
      # what actually changed (skia never rebuilds unless neovide.yml does).
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('**/*.yml', 'patches/**', 'neovim/config/**') }}
          restore-keys: flatpak-builder-

      # ubuntu runner images no longer ship flatpak. The sysctl lifts
      # Ubuntu's AppArmor restriction on unprivileged user namespaces,
      # which otherwise breaks bwrap/flatpak sandboxing (no-op elsewhere).
      - name: Install flatpak and flatpak-builder
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak --version
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install --noninteractive -y flathub org.flatpak.Builder

      # flatpak-builder installs the SDK by shelling out to the flatpak
      # bundled inside org.flatpak.Builder, which requires a session
      # D-Bus (the runner has none: "Cannot autolaunch D-Bus without
      # X11 $DISPLAY"). Builder does not share a host session bus, so run
      # one at a fixed path and inject the address into its sandbox via
      # flatpak run --env below (--filesystem=host makes the socket
      # reachable inside the sandbox).
      - name: Start session D-Bus
        run: |
          sudo apt-get install -y dbus
          dbus-daemon --session --fork --address="unix:path=$RUNNER_TEMP/session-bus"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$RUNNER_TEMP/session-bus" >> "$GITHUB_ENV"

      # Used by --gpg-sign below; the Builder sandbox can read
      # $HOME/.gnupg through --filesystem=host.
      - name: Import repo signing key
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY_B64" | base64 -d | gpg --import

      # Mirrors buildall.sh (same flags) plus --repo for the export and
      # --gpg-sign for signed commits. Debug info is split into .Debug
      # extension refs automatically; they are no-autodownload and tiny
      # (Release builds), so they ship harmlessly.
      - name: Build com.hcssmith.Nvim
        run: |
          flatpak run --env=DBUS_SESSION_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" \
            org.flatpak.Builder --user --install-deps-from=flathub \
            --force-clean --disable-rofiles-fuse --repo=repo \
            --gpg-sign="$FLATPAK_GPG_FINGERPRINT" \
            build/com.hcssmith.Nvim com.hcssmith.Nvim.yml

      # Neovide layers on the Nvim app (base: com.hcssmith.Nvim,
      # base-version: master); install it from the repo just exported so
      # flatpak-builder can resolve the base.
      # The exported repo is signed; --gpg-import registers the key so
      # the signed commits verify during the install.
      - name: Install base app for the Neovide build
        run: |
          gpg --export --armor "$FLATPAK_GPG_FINGERPRINT" > signing-key.asc
          flatpak --user remote-add --if-not-exists --gpg-import=signing-key.asc hcssmith-local "$PWD/repo"
          flatpak --user install --noninteractive --or-update hcssmith-local com.hcssmith.Nvim

      - name: Build com.hcssmith.Neovide
        run: |
          flatpak run --env=DBUS_SESSION_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" \
            org.flatpak.Builder --user --install-deps-from=flathub \
            --force-clean --disable-rofiles-fuse --repo=repo \
            --gpg-sign="$FLATPAK_GPG_FINGERPRINT" \
            build/com.hcssmith.Neovide com.hcssmith.Neovide.yml

      - name: Build com.hcssmith.St
        run: |
          flatpak run --env=DBUS_SESSION_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" \
            org.flatpak.Builder --user --install-deps-from=flathub \
            --force-clean --disable-rofiles-fuse --repo=repo \
            --gpg-sign="$FLATPAK_GPG_FINGERPRINT" \
            build/com.hcssmith.St com.hcssmith.St.yml

      - name: Finalize repo metadata and static deltas
        run: |
          flatpak build-update-repo --generate-static-deltas \
            --gpg-sign="$FLATPAK_GPG_FINGERPRINT" \
            --title "hcssmith" repo

      # The published frontend lives in html/ (template + apps.txt) and is
      # rendered by html/render.py into the site root; it also copies any
      # extra static files dropped in html/. The flatpakrepo is generated
      # here because it embeds the signing key.
      - name: Add site files
        run: |
          python3 html/render.py repo
          cat > repo/hcssmith.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=hcssmith
          Url=https://$SITE_DOMAIN
          Homepage=https://github.com/hcssmith/flatpak-repo
          Comment=hcssmith's personal Flatpak repository
          Description=Nvim and Neovide built from github.com/hcssmith/flatpak-repo
          EOF
          echo "GPGKey=$(gpg --export --armor "$FLATPAK_GPG_FINGERPRINT" | base64 -w0)" >> repo/hcssmith.flatpakrepo

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
