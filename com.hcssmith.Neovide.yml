id: com.hcssmith.Neovide
runtime: org.freedesktop.Sdk
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # skia-bindings' bindgen needs a libclang newer than the SDK's
  - org.freedesktop.Sdk.Extension.llvm22

# Reuse the nvim app as the base so nvim, its deps, parsers, ripgrep and
# the clipboard tools are never rebuilt for this app.
base: com.hcssmith.Nvim
base-version: master

command: neovide

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

modules:
  # gn builds skia; it is only needed at build time but installs to
  # /app/bin, so it is cleaned up below.
  - lib/gn.yml

  - bin/neovide/neovide.yml

  # Launcher entry + icon for GNOME Shell; separate module so it can be
  # tweaked without rebuilding neovide/skia.
  - bin/neovide/desktop.yml

cleanup:
  - /bin/gn
