id: com.hcssmith.Nvim
runtime: org.freedesktop.Sdk
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: nvim

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --filesystem=home

modules:
  - neovim/build-deps.yml
  - neovim/ts-full.yml
  - neovim/neovim-source.yml
  - neovim/config.yml
  - neovim/plugins.yml

  - bin/ripgrep/ripgrep.yml

  # Clipboard providers: nvim picks wl-clipboard on wayland sessions and
  # xclip on X11/XWayland automatically ($WAYLAND_DISPLAY / $DISPLAY).
  # libXmu is xclip's build dependency and must come before it.
  - lib/libxmu.yml
  - bin/wl-clipboard.yml
  - bin/xclip.yml

  - name: neovim-wrapper
    buildsystem: simple
    build-commands:
      - mv /app/bin/nvim /app/bin/nvim.bin
      - |
        install -Dm755 /dev/stdin /app/bin/nvim <<'WRAPPER'
        #!/bin/sh
        export XDG_CONFIG_HOME=/app/etc
        exec /app/bin/nvim.bin "$@"
        WRAPPER

# Build-only artifacts. nvim.bin links luajit, libuv, luv, lpeg, unibilium,
# utf8proc and tree-sitter statically (verified: no /app libs in its NEEDED
# entries), so only headers, link metadata and archives are needed while
# modules build; cleanup runs after the last module finishes.
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - '*.a'
  - '*.la'
  # Shared libs with no runtime consumer: nvim.bin embeds luajit and libuv
  # statically, and xclip links only libXmu.so.6 (kept).
  - /lib/libluajit-5.1.so*
  - /lib/libuv.so*
  - /lib/libXmuu.so*
  # Standalone luajit interpreter: only used at build time (LUA_PRG).
  - /bin/luajit*
  - /share/man
  - /share/doc

