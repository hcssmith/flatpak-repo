name: luv
buildsystem: cmake-ninja
config-opts:
  # Mirrors neovim's cmake.deps BuildLuv recipe.
  - -DCMAKE_BUILD_TYPE=Release
  - -DLUA_BUILD_TYPE=System        # use the luajit installed in /app
  - -DWITH_LUA_ENGINE=LuaJit
  - -DLUA_COMPAT53_DIR=/run/build/luv/lua-compat-5.3
  - -DWITH_SHARED_LIBUV=ON         # link the external libuv rather than vendoring one
  - -DBUILD_STATIC_LIBS=ON         # libluv.a is what neovim's FindLuv looks for
  - -DBUILD_MODULE=OFF
  - -DCMAKE_PREFIX_PATH=/app
sources:
  - type: git
    url: https://github.com/luvit/luv.git
    tag: 1.52.1-0
    disable-submodules: true
  - type: git
    url: https://github.com/lunarmodules/lua-compat-5.3.git
    tag: v0.14.3
    dest: lua-compat-5.3

