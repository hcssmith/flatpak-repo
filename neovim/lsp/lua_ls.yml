name: lua-language-server
buildsystem: simple
sources:
  # Prebuilt upstream release: building from source needs xmake plus a
  # self-hosting bee.lua toolchain, not worth vendoring for one server.
  # type:file + manual tar, not type:archive: flatpak-builder (1.4.12)
  # strips the first path component of every member, and LuaLS ships this
  # tarball flat (no top-level wrapper dir), which flattens bin/, script/
  # and meta/ into one directory.
  - type: file
    url: https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz
    sha256: 93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947
build-commands:
  # The binary resolves main.lua/meta/script relative to itself, so the tree
  # must stay together; /app/bin gets a -E wrapper instead of the raw binary.
  - mkdir -p /app/share/lua-language-server
  - tar xzf lua-language-server-3.19.2-linux-x64.tar.gz -C /app/share/lua-language-server
  - |
    install -Dm755 /dev/stdin /app/bin/lua-language-server <<'WRAPPER'
    #!/bin/sh
    exec /app/share/lua-language-server/bin/lua-language-server \
      -E /app/share/lua-language-server/main.lua "$@"
    WRAPPER
