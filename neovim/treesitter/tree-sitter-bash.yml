name: tree-sitter-bash
buildsystem: cmake-ninja
config-opts:
  - -DPARSERLANG=bash
sources:
  - type: git
    url: https://github.com/tree-sitter/tree-sitter-bash.git
    tag: v0.25.1
    disable-submodules: true
    disable-lfs: true
  - type: file
    path: patches/TreesitterParserCMakeLists.txt
    dest-filename: CMakeLists.txt
