name: tree-sitter-python
buildsystem: cmake-ninja
config-opts:
  - -DPARSERLANG=python
sources:
  - type: git
    url: https://github.com/tree-sitter/tree-sitter-python.git
    tag: v0.25.0
    disable-submodules: true
    disable-lfs: true
  - type: file
    path: patches/TreesitterParserCMakeLists.txt
    dest-filename: CMakeLists.txt
