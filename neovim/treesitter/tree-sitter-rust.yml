name: tree-sitter-rust
buildsystem: cmake-ninja
config-opts:
  - -DPARSERLANG=rust
sources:
  - type: git
    url: https://github.com/tree-sitter/tree-sitter-rust.git
    tag: v0.24.2
    disable-submodules: true
    disable-lfs: true
  - type: file
    path: patches/TreesitterParserCMakeLists.txt
    dest-filename: CMakeLists.txt
