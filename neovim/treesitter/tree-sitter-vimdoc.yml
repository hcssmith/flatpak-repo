name: tree-sitter-vimdoc
buildsystem: cmake-ninja
config-opts:
  - -DPARSERLANG=vimdoc
sources:
  - type: git
    url: https://github.com/neovim/tree-sitter-vimdoc.git
    tag: v4.1.0
    disable-submodules: true
    disable-lfs: true
  - type: file
    path: patches/TreesitterParserCMakeLists.txt
    dest-filename: CMakeLists.txt
